plugins { id 'com.android.application' }
android {
    namespace 'app.xingshu.installer'
    compileSdk 35
    defaultConfig {
        applicationId 'app.xingshu.installer'
        minSdk 26
        targetSdk 35
        versionCode 2026102201
        versionName '0.1.0-test.20261022.1'
    }
    buildFeatures { aidl true; buildConfig true }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main {
        java.srcDir "$buildDir/generated/payload/java"
        assets.srcDir "$buildDir/generated/payload/assets"
    }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
