plugins { id 'com.android.application' }
android {
    namespace 'app.xingshu.installer'
    compileSdk 35
    defaultConfig {
        applicationId 'app.xingshu.installer'
        minSdk 26
        targetSdk 35
        versionCode 2026102902
        versionName '0.1.0-test.20261029.2'
    }
    buildFeatures { aidl true; buildConfig true }
    buildTypes { release { minifyEnabled false } }
    // Published APKs already use the signed feed's date sequence; renumbering would prevent upgrades.
    // The shared update protocol caps it at 2,100,000,000, below Android's signed integer limit.
    lint { warning 'HighAppVersionCode' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main {
        java.srcDir "$buildDir/generated/payload/java"
        assets.srcDir "$buildDir/generated/payload/assets"
    }
}
dependencies {
    implementation project(':localadb')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
